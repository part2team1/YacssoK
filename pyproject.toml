[project]
name = "pill-detection"
version = "0.1.0"
description = "경구약제 이미지 객체 탐지 - Health Eat AI 엔지니어링 팀"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "opencv-python>=4.9",
    "pillow>=10.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "torch>=2.3",
    "torchvision>=0.18",
    "torchmetrics>=1.4",
    "pycocotools>=2.0.7",
    "ultralytics>=8.3",
]

# src/ 를 패키지로 설치 → 스크립트·노트북 어디서든 `from src.dataset import ...` 가능
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
# 데모 담당만 설치: uv sync --extra demo
demo = ["gradio>=4.44"]
# 실험 기록을 W&B로 할 경우: uv sync --extra tracking
tracking = ["wandb>=0.17"]

[dependency-groups]
# uv sync 시 기본으로 함께 설치되는 개발 도구
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ruff==0.16.10",       # .pre-commit-config.yaml의 ruff-pre-commit rev와 같게
]

# ── PyTorch GPU(CUDA) 빌드 설정 ─────────────────────────────────
# Windows·Linux + NVIDIA GPU는 CUDA 빌드를, macOS는 PyPI 기본 빌드를 받는다.
# CUDA 버전은 팀 GPU 드라이버에 맞춰 Y가 한 번만 정한다 (nvidia-smi의 "CUDA Version" 확인).
# GPU가 없는 팀원만 있다면 이 블록 전체를 지우면 CPU 빌드가 설치된다.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# ── 코드 스타일 (Source 작성 표준) ─────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 노트북은 셀 중간 import, 짧은 한 줄 그리기를 허용
"notebooks/*" = ["E402", "E702", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
