# pegstar(모델 A, m) 데이터 실험 계획: 기준 모델 YOLO26m 하나로 지금 할 수 있는 실험만 (AI Hub 없이)
#   uv run python scripts/run_matrix.py --plan configs/matrix_pegstar.yaml --dry-run
#   uv run python scripts/run_matrix.py --plan configs/matrix_pegstar.yaml
# 먼저 데이터 버전 만들기 (각자 PC, 몇 분):
#   uv run python scripts/make_copy_paste.py --config configs/base.yaml --version v2   (D2)
#   uv run python scripts/clean_labels.py --config configs/base.yaml --version v1      (D5·D10)
prefix: 1102_pegstar           # 실험 이름 = {prefix}_{모델}_{실험}

models:
  yolo26m: configs/yolo_m_26m.yaml      # img 640, batch 8, epoch 50, seed 42

bundles:                       # matrix_data.yaml과 같은 값 (D4만 26m 메모리 때문에 batch 4)
  D1: [data.repeat_threshold=0.1]
  D2: [data.version=v2, data.train_images=data/synth/v2/images, data.train_annotations=data/annotations/v2.json]
  D3: [yolo_args.fliplr=0.5, yolo_args.flipud=0.5, yolo_args.degrees=0.0, yolo_args.hsv_h=0.0,
       yolo_args.hsv_s=0.4, yolo_args.hsv_v=0.3, yolo_args.scale=0.3, yolo_args.translate=0.1,
       yolo_args.mosaic=1.0, yolo_args.close_mosaic=10]
  D4: [data.img_size=1024, train.batch_size=4]
  D5: [data.version=v1, data.train_annotations=data/annotations/v1.json]
  D9: [yolo_args.mixup=0.1, yolo_args.scale=0.5]
  # 결합 데이터: 정제 v1 위에 copy-paste (D5·D10 + D2). 먼저:
  #   uv run python scripts/make_copy_paste.py --config configs/yolo_v1_clean.yaml --version v2c
  V2C: [data.version=v2c, data.train_images=data/synth/v2c/images, data.train_annotations=data/annotations/v2c.json]
  D1L: [data.repeat_threshold=0.05]   # D1+D2는 같은 드문 알약을 겹쳐 반복하므로 약하게

runs:                          # 짧은 것부터, 오래 걸리는 img1024는 맨 뒤
  base: []                     # D0 기준
  rfs01: [D1]
  augsafe: [D3]
  augmixup: [D3, D9]
  copypaste: [D2]              # v2를 먼저 만들어야 함 (없으면 "데이터 없음"으로 건너뜀)
  clean: [D5]                  # v1을 먼저 만들어야 함. 검증 정답이 바뀌므로 base를 v1 정답으로 다시 채점해 비교
  img1024: [D4]                # 26m + 1024는 학습 시간 3~4배
  # 결합 (단일 결과: rfs01 +0.012, copypaste +0.017, clean은 v1 정답 재채점 후 판단)
  v2c: [V2C]                   # 정제 + 합성
  v2c_rfs01: [V2C, D1]         # 정제 + 합성 + 재표본화 0.1
  v2c_rfs005: [V2C, D1L]       # 정제 + 합성 + 재표본화 0.05
