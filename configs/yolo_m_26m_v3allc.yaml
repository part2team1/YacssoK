# 26m + v3allc (정제 v1 + AI Hub 새 클래스 포함). 데이터 B의 yolo_v3allc_aihub.yaml에서 모델만 26m으로 바꿈
# 먼저: clean_labels(v1) → make_external(v3allc, --classes all) → export_yolo(yolo_v3allc_aihub.yaml)
# K-fold: kfold_split(v1) → make_ext_folds(v1 → v3allc) → run_kfold --folds 0 1 2 3 4
base: yolo_v3allc_aihub.yaml
exp_name: 1104_pegstar_yolo26m_v3allc
owner: pegstar
note: 26m을 v3allc로 학습, 검증은 v1 val (8GB GPU라 batch 8)

model:
  weights: yolo26m.pt

train:
  batch_size: 8
