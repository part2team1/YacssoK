base: yolo_m_26m_S1.yaml
exp_name: 1029_pegstar_yolo26m_v0_S2
owner: pegstar
note: "S2 증강: S1 + 안전 증강(yolo_aug_safe: 뒤집기, 채도·명도·크기·위치, 모자이크, 색조 고정, 회전 없음)"
yolo_args:
  fliplr: 0.5
  flipud: 0.5
  degrees: 0.0
  hsv_h: 0.0
  hsv_s: 0.4
  hsv_v: 0.3
  scale: 0.3
  translate: 0.1
  mosaic: 1.0
