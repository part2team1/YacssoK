# configs/yolo_img1024.yaml
base: yolo_baseline.yaml          # baseline 설정을 물려받고, 아래에 적은 값만 바뀜

exp_name: 1024_sun_yolov8s_v0_img1024   # {날짜}_{이름}_{모델}_{데이터버전}_{바꾼 점}
owner: sun
note: "작은 알약 각인을 보기 위해 입력 해상도 640 → 1024 (실험 D6)"

data:
  img_size: 1024                  # 이번 실험에서 바꾸는 값

train:
  batch_size: 8                   # 해상도를 키우면 GPU 메모리를 더 쓰므로 16 → 8